<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="terraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Emerald Leaf Gradient Left -->
    <linearGradient id="leafGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Emerald Leaf Gradient Right -->
    <linearGradient id="leafGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Golden Horizon / Earth Arc Gradient -->
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Emerald Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect width="512" height="512" rx="112" fill="url(#terraBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="6" />

  <!-- Earth / Soil Horizon Arc -->
  <path d="M104 380 C180 424, 332 424, 408 380" fill="none" stroke="url(#goldArc)" stroke-width="22" stroke-linecap="round" />

  <!-- Left Botanical Leaf -->
  <path d="M256 360 C248 268, 156 198, 124 182 C124 256, 180 336, 256 360 Z"
        fill="url(#leafGradLeft)"
        filter="url(#emeraldGlow)" />

  <!-- Right Botanical Leaf -->
  <path d="M256 360 C264 246, 368 166, 394 134 C394 224, 328 328, 256 360 Z"
        fill="url(#leafGradRight)" />

  <!-- Center Sprout Stem -->
  <path d="M256 360 V156 C256 108, 288 84, 288 84 C272 116, 256 140, 256 156"
        fill="none"
        stroke="#E0F2FE"
        stroke-width="16"
        stroke-linecap="round" />

  <!-- Radiant Golden Apex Spark -->
  <circle cx="344" cy="116" r="20" fill="url(#goldArc)" />
</svg>